    <text x="86" y="226" fill="#191919" font-size="92" font-weight="700" letter-spacing="-2">DoorDash</text>
    <text x="86" y="282" fill="#757575" font-size="25" font-weight="400">Food first. Fast decisions. Checkout in red.</text>

    <g transform="translate(86 354)">
