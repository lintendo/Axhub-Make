        <text x="18" y="279" fill="#FF8000" font-size="15">★</text>
        <text x="39" y="279" fill="#757575" font-size="14">4.8 · 20 min ·</text>
        <text x="142" y="279" fill="#008B4A" font-size="14" font-weight="600">$0 delivery</text>
