      <text x="72" y="635" fill="#EB1700" text-anchor="middle" font-size="12" font-weight="700">2</text>
      <text x="98" y="636" fill="#FFFFFF" font-size="16" font-weight="700">Checkout</text>
      <text x="382" y="636" fill="#FFFFFF" text-anchor="end" font-size="16" font-weight="700">$23.40</text>

      <line x1="16" y1="702" x2="432" y2="702" stroke="#E5E5E5"/>
      <text x="68" y="742" fill="#EB1700" text-anchor="middle" font-size="12" font-weight="700">Home</text>
      <text x="172" y="742" fill="#757575" text-anchor="middle" font-size="12" font-weight="600">Offers</text>
      <text x="276" y="742" fill="#757575" text-anchor="middle" font-size="12" font-weight="600">Orders</text>
      <text x="380" y="742" fill="#757575" text-anchor="middle" font-size="12" font-weight="600">Account</text>
